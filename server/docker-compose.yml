services:
  blog-dynamic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${BLOG_DYNAMIC_NODE_IMAGE:-node:22-bookworm-slim}
    image: blog-dynamic:local
    container_name: blog-dynamic
    restart: unless-stopped
    env_file:
      - /etc/blog-dynamic.env
    environment:
      BLOG_DYNAMIC_HOST: 0.0.0.0
      BLOG_DYNAMIC_PORT: "8787"
      BLOG_DYNAMIC_DATA_DIR: /var/lib/blog-dynamic
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /var/lib/blog-dynamic:/var/lib/blog-dynamic
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    profiles:
      - tunnel
    image: cloudflare/cloudflared:latest
    container_name: blog-dynamic-cloudflared
    restart: unless-stopped
    network_mode: host
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflared_token
    volumes:
      - ${BLOG_DYNAMIC_CLOUDFLARED_TOKEN_FILE:-/etc/blog-dynamic-cloudflared.token}:/run/secrets/cloudflared_token:ro
    depends_on:
      blog-dynamic:
        condition: service_healthy
